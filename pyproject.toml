[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-quest-editor"
version = "0.9.6a0"
description = "Editor desktop universal para autoria, tradução e portabilidade de Quest Books do Minecraft"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "Pillow>=10,<12",
]

[project.scripts]
alpha-quest-editor = "alphaquest.app:main"

[tool.setuptools.packages.find]
include = ["alphaquest*"]

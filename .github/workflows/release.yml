name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Core tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/test_core.py

      - name: Build ONEFILE application
        run: python -m PyInstaller --noconfirm --clean AlphaQuestEditor.spec

      - name: Package Windows single EXE
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if (-not (Test-Path "dist/AlphaQuestEditor.exe")) { throw "dist/AlphaQuestEditor.exe nao encontrado" }
          Copy-Item "dist/AlphaQuestEditor.exe" "AlphaQuestEditor-v$version-Windows-x64.exe"

      - name: Package Linux single binary
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          test -f dist/AlphaQuestEditor
          cp dist/AlphaQuestEditor "AlphaQuestEditor-v${version}-Linux-x64"
          chmod +x "AlphaQuestEditor-v${version}-Linux-x64"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            AlphaQuestEditor-v*-Windows-x64.exe
            AlphaQuestEditor-v*-Linux-x64
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-x64"
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          title="Alpha Quest Editor ${tag}"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag ja existe. Atualizando assets..."
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "Criando release $tag..."
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "$title"
          fi

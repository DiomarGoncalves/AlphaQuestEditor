name: Build Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: ubuntu-latest
            artifact: linux-x64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Core tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/test_core.py

      - name: Build application
        run: python -m PyInstaller --noconfirm --clean AlphaQuestEditor.spec

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          Copy-Item README.md, CHANGELOG.md, LICENSE, THIRD_PARTY_NOTICES.md -Destination dist/AlphaQuestEditor -Force
          Compress-Archive -Path dist/AlphaQuestEditor/* -DestinationPath "AlphaQuestEditor-v$version-Windows-x64.zip" -CompressionLevel Optimal

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          cp README.md CHANGELOG.md LICENSE THIRD_PARTY_NOTICES.md dist/AlphaQuestEditor/
          tar -C dist -czf "AlphaQuestEditor-v${version}-Linux-x64.tar.gz" AlphaQuestEditor

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            AlphaQuestEditor-v*-Windows-x64.zip
            AlphaQuestEditor-v*-Linux-x64.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-x64"
          merge-multiple: true
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release-assets/* --generate-notes --title "Alpha Quest Editor ${GITHUB_REF_NAME}"
